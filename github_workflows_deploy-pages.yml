# CI workflow: build and publish to GitHub Pages
on:
  push:
    branches: [ main ]   # change if you use a different default branch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build         # ← replace with your build command if different

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist             # ← replace with your build output folder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1